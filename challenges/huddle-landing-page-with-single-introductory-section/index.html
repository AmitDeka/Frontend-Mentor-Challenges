<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

  <link rel="stylesheet" href="./assets/style.css">
  <script src="https://kit.fontawesome.com/f7ef8a74d5.js" crossorigin="anonymous"></script>
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="/">
        <img src="./images/logo.svg" alt="Logo">
      </a>
    </div>
  </nav>

  <main>
    <section class="hero-wrapper">
      <div class="container">
        <div class="hero_content">
          <div class="hero_content-image">
            <img src="./images/illustration-mockups.svg" alt="Illustration Mockups">
          </div>
          <div class="hero_content-text">
            <h1>Build The Community Your Fans Will Love</h1>
            <p>Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
              Create connections with your users as you engage in genuine discussion.
            </p>
            <div class="hero_content-text-button">
              <a href="/">Register</a>
            </div>
          </div>
        </div>

        <!-- Social Links  -->
        <div class="social_links">
          <ul>
            <li>
              <a href="#">
                <i class="fa-brands fa-facebook-f"></i> </a>
            </li>
            <li>
              <a href="#">
                <i class="fa-brands fa-twitter"></i>
              </a>
            </li>
            <li>
              <a href="#">
                <i class="fa-brands fa-instagram"></i>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://www.amitdeka.work/">Amit Deka</a>.
    </p>
  </footer>
</body>

</html>
