<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./Social-links-profile/assets/images/favicon-32x32.png" />

  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="./Social-links-profile/assets/style/global.css" />
</head>

<body>
  <main>
    <div class="container">
      <div class="card">
        <div class="card_image">
          <img src="./Social-links-profile/assets/images/avatar-jessica.jpeg" alt="Profile Image" />
        </div>
        <div class="card_body">
          <h1>Jessica Randall</h1>
          <h2>London, United Kingdom</h2>
          <p>"Front-end developer and avid reader."</p>
        </div>
        <div class="card_linksList">
          <ul>
            <li><a href="" target="_blank">GitHub</a></li>
            <li><a href="" target="_blank">Frontend Mentor</a></li>
            <li><a href="" target="_blank">LinkedIn</a></li>
            <li><a href="" target="_blank">Twitter</a></li>
            <li><a href="" target="_blank">Instagram</a></li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a
        href="#">Amit Deka</a>.
    </div>
  </footer>
</body>

</html>
